# ──────────────────────────────────────────────────────────────
# Trivy Monthly Report – Monthly Docker Security Report
# ──────────────────────────────────────────────────────────────
# Runs on the 1st Monday of each month at 09:00 CET (08:00 UTC)
# and creates a GitHub Issue with the full Trivy Docker image
# security report.
#
# Builds the Docker image, scans it with Trivy and generates
# a monthly report as a GitHub Issue.
#
# Trigger: 1st Monday of the month 08:00 UTC (= 09:00 CET)
#          Manual via workflow_dispatch
# ──────────────────────────────────────────────────────────────

name: Trivy Monthly Report

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  trivy-monthly-report:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check if 1st Monday of the month ──────────────────
      - name: Check if 1st Monday of the month
        id: check
        run: |
          DAY=$(date -u +%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger – generating report."
            echo "skip=false" >> $GITHUB_OUTPUT
          elif [ "$DAY" -le "7" ]; then
            echo "1st Monday of the month – generating report."
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "Not the 1st Monday – skipped."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      # ── 2. Checkout repository ────────────────────────────────
      - name: Checkout
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4

      # ── 3. Build Docker image ─────────────────────────────────
      - name: Build Docker image
        if: steps.check.outputs.skip != 'true'
        run: |
          docker build -t schunk-gripper:monthly-scan .

      # ── 4. Install Trivy ──────────────────────────────────────
      - name: Install Trivy
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      # ── 5. Full image scan ────────────────────────────────────
      - name: "Trivy: Full image scan"
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p security/trivy-reports

          trivy image \
            --format json \
            --output security/trivy-reports/trivy_image_report.json \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            schunk-gripper:monthly-scan || true

          trivy image \
            --format table \
            --output security/trivy-reports/trivy_image_report.txt \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            schunk-gripper:monthly-scan || true

      # ── 6. HIGH/CRITICAL scan ─────────────────────────────────
      - name: "Trivy: HIGH/CRITICAL scan"
        if: steps.check.outputs.skip != 'true'
        run: |
          trivy image \
            --format json \
            --output security/trivy-reports/trivy_high_critical.json \
            --severity HIGH,CRITICAL \
            schunk-gripper:monthly-scan || true

          trivy image \
            --format table \
            --output security/trivy-reports/trivy_high_critical.txt \
            --severity HIGH,CRITICAL \
            schunk-gripper:monthly-scan || true

      # ── 7. Dockerfile config scan ─────────────────────────────
      - name: "Trivy: Dockerfile config scan"
        if: steps.check.outputs.skip != 'true'
        run: |
          trivy config \
            --format json \
            --output security/trivy-reports/trivy_config_report.json \
            Dockerfile || true

          trivy config \
            --format table \
            --output security/trivy-reports/trivy_config_report.txt \
            Dockerfile || true

      # ── 8. Generate monthly report ────────────────────────────
      - name: Generate monthly report
        if: steps.check.outputs.skip != 'true'
        id: report
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          MONTH=$(date -u +"%B %Y")

          # Count vulnerabilities
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' security/trivy-reports/trivy_image_report.json 2>/dev/null || echo "0")
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' security/trivy-reports/trivy_image_report.json 2>/dev/null || echo "0")
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' security/trivy-reports/trivy_image_report.json 2>/dev/null || echo "0")
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' security/trivy-reports/trivy_image_report.json 2>/dev/null || echo "0")
          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))
          MISCONFIGS=$(jq '[.Results[]?.Misconfigurations[]?] | length' security/trivy-reports/trivy_config_report.json 2>/dev/null || echo "0")

          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "medium=${MEDIUM}" >> "$GITHUB_OUTPUT"
          echo "low=${LOW}" >> "$GITHUB_OUTPUT"
          echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
          echo "misconfigs=${MISCONFIGS}" >> "$GITHUB_OUTPUT"
          echo "month=${MONTH}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

          # Generate Markdown monthly report
          python3 - <<'PYEOF'
          import json, datetime, os

          date = os.environ.get("DATE", datetime.date.today().isoformat())
          month = datetime.datetime.now().strftime("%B %Y")

          # Load image scan
          try:
              with open("security/trivy-reports/trivy_image_report.json") as f:
                  img_data = json.load(f)
          except Exception:
              img_data = {}

          # Load config scan
          try:
              with open("security/trivy-reports/trivy_config_report.json") as f:
                  cfg_data = json.load(f)
          except Exception:
              cfg_data = {}

          # Collect vulnerabilities
          all_vulns = []
          for result in img_data.get("Results", []):
              target = result.get("Target", "")
              for v in result.get("Vulnerabilities", []):
                  all_vulns.append({
                      "target": target,
                      "id": v.get("VulnerabilityID", ""),
                      "pkg": v.get("PkgName", ""),
                      "installed": v.get("InstalledVersion", ""),
                      "fixed": v.get("FixedVersion", ""),
                      "severity": v.get("Severity", ""),
                      "title": v.get("Title", ""),
                      "url": v.get("PrimaryURL", ""),
                  })

          by_sev = {}
          for v in all_vulns:
              by_sev.setdefault(v["severity"], []).append(v)

          # Misconfigurations
          misconfigs = []
          for result in cfg_data.get("Results", []):
              for m in result.get("Misconfigurations", []):
                  misconfigs.append({
                      "id": m.get("ID", ""),
                      "avdid": m.get("AVDID", ""),
                      "title": m.get("Title", ""),
                      "severity": m.get("Severity", ""),
                      "desc": m.get("Description", ""),
                      "url": m.get("PrimaryURL", ""),
                  })

          critical = by_sev.get("CRITICAL", [])
          high = by_sev.get("HIGH", [])
          medium = by_sev.get("MEDIUM", [])
          low = by_sev.get("LOW", [])

          lines = []
          lines.append(f"# 🐳 Trivy Docker Image Monthly Report – {month}")
          lines.append("")
          lines.append(f"**Reporting period:** {month}")
          lines.append(f"**Generated on:** {date}")
          lines.append("**Image:** schunk-gripper (built from Dockerfile)")
          lines.append("**Base image:** ros:humble-ros-core (Ubuntu 22.04 Jammy)")
          lines.append("**Scanner:** Trivy (GitHub Actions)")
          lines.append("")
          lines.append("---")
          lines.append("")
          lines.append("## Overview")
          lines.append("")
          lines.append("| Severity | Count |")
          lines.append("|----------|-------|")
          lines.append(f"| CRITICAL | {len(critical)} |")
          lines.append(f"| HIGH     | {len(high)} |")
          lines.append(f"| MEDIUM   | {len(medium)} |")
          lines.append(f"| LOW      | {len(low)} |")
          lines.append(f"| **Total** | **{len(all_vulns)}** |")
          lines.append("")
          lines.append(f"**Dockerfile misconfigurations:** {len(misconfigs)}")
          lines.append("")

          # CRITICAL + HIGH details
          for sev_label, sev_list in [("CRITICAL", critical), ("HIGH", high)]:
              lines.append("---")
              lines.append("")
              lines.append(f"## {sev_label} Vulnerabilities ({len(sev_list)})")
              lines.append("")
              if not sev_list:
                  lines.append(f"No {sev_label} vulnerabilities found. ✅")
                  lines.append("")
              else:
                  lines.append("| Package | CVE | Installed | Fix | Description |")
                  lines.append("|---------|-----|-----------|-----|-------------|")
                  for v in sev_list:
                      fix = v["fixed"] if v["fixed"] else "—"
                      title = v["title"][:70] if v["title"] else "—"
                      lines.append(f"| {v['pkg']} | [{v['id']}]({v['url']}) | {v['installed']} | {fix} | {title} |")
                  lines.append("")

          # MEDIUM/LOW summary only
          lines.append("---")
          lines.append("")
          lines.append("## MEDIUM/LOW Vulnerabilities")
          lines.append("")
          lines.append(f"- **MEDIUM:** {len(medium)} vulnerabilities")
          lines.append(f"- **LOW:** {len(low)} vulnerabilities")
          lines.append("")
          lines.append("For details see full report: `security/trivy-reports/trivy_image_report.txt`")
          lines.append("")

          # Dockerfile misconfigurations
          if misconfigs:
              lines.append("---")
              lines.append("")
              lines.append(f"## Dockerfile Misconfigurations ({len(misconfigs)})")
              lines.append("")
              lines.append("| ID | Severity | Description |")
              lines.append("|----|----------|-------------|")
              for m in misconfigs:
                  desc = m["title"][:60] if m["title"] else m["desc"][:60]
                  url = m["url"] or ""
                  mid = m["avdid"] or m["id"]
                  lines.append(f"| [{mid}]({url}) | {m['severity']} | {desc} |")
              lines.append("")

          lines.append("---")
          lines.append("")
          lines.append("*Automatically generated by GitHub Actions (Trivy Monthly Report Workflow).*")

          report_path = "security/trivy-reports/trivy_monthly_report.md"
          with open(report_path, "w") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Monthly report: {len(critical)} CRITICAL, {len(high)} HIGH, {len(medium)} MEDIUM, {len(low)} LOW")
          print(f"Misconfigs: {len(misconfigs)}")
          PYEOF

          echo "--- Monthly report generated ---"
          cat security/trivy-reports/trivy_monthly_report.md | head -40

      # ── 9. Update summary ─────────────────────────────────────
      - name: Update summary
        if: steps.check.outputs.skip != 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          REPORT="security/trivy-reports/trivy_summary.md"

          CRITICAL=${{ steps.report.outputs.critical }}
          HIGH=${{ steps.report.outputs.high }}
          MEDIUM=${{ steps.report.outputs.medium }}
          LOW=${{ steps.report.outputs.low }}
          TOTAL=${{ steps.report.outputs.total }}
          MISCONFIGS=${{ steps.report.outputs.misconfigs }}

          cat > "$REPORT" << EOF
          # Trivy Docker Image Scan – Summary

          **Date:** ${DATE}
          **Image:** schunk-gripper:scan (built from Dockerfile)
          **Base image:** ros:humble-ros-core (Ubuntu 22.04 Jammy)
          **Scanner:** Trivy (GitHub Actions)

          ## Vulnerabilities (Image Scan)

          | Severity | Count |
          |----------|-------|
          | CRITICAL | ${CRITICAL} |
          | HIGH     | ${HIGH} |
          | MEDIUM   | ${MEDIUM} |
          | LOW      | ${LOW} |
          | **Total** | **${TOTAL}** |

          ## Dockerfile Misconfigurations

          Misconfigurations found: **${MISCONFIGS}**

          ## Reports

          - **[trivy_high_critical.md](trivy_high_critical.md) – HIGH/CRITICAL vulnerabilities (Markdown)**
          - **[trivy_monthly_report.md](trivy_monthly_report.md) – Monthly full report**
          - [trivy_high_critical.json](trivy_high_critical.json) – HIGH/CRITICAL vulnerabilities (JSON)
          - [trivy_high_critical.txt](trivy_high_critical.txt) – HIGH/CRITICAL vulnerabilities (table)
          - [trivy_image_report.json](trivy_image_report.json) – Full image scan (JSON)
          - [trivy_image_report.txt](trivy_image_report.txt) – Image scan (table)
          - [trivy_config_report.json](trivy_config_report.json) – Dockerfile config scan (JSON)
          - [trivy_config_report.txt](trivy_config_report.txt) – Dockerfile config scan (table)

          ---
          *Automatically generated by GitHub Actions (Trivy Docker Image Scan / Trivy Monthly Report Workflow).*
          EOF

          sed -i 's/^          //' "$REPORT"

      # ── 10. Commit reports ────────────────────────────────────
      - name: Commit reports
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f security/trivy-reports/ || echo "Nothing to add."
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "security: Trivy Monthly Report $(date -u +%Y-%m-%d)"
          git push

      # ── 11. Create monthly report issue ───────────────────────
      - name: Create monthly report issue
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          CRITICAL: ${{ steps.report.outputs.critical }}
          HIGH: ${{ steps.report.outputs.high }}
          MEDIUM: ${{ steps.report.outputs.medium }}
          LOW: ${{ steps.report.outputs.low }}
          TOTAL: ${{ steps.report.outputs.total }}
          MISCONFIGS: ${{ steps.report.outputs.misconfigs }}
          MONTH_NAME: ${{ steps.report.outputs.month }}
          REPORT_DATE: ${{ steps.report.outputs.date }}
        run: |
          set -e
          TITLE="🐳 Trivy Monthly Report – Docker Image Security – ${MONTH_NAME}"

          gh label create "trivy-monthly-report" \
            --description "Monthly Trivy Docker image security report" \
            --color "1d76db" 2>/dev/null || true

          # Duplicate protection (schedule only)
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            YEAR_MONTH=$(date -u +"%Y-%m")
            EXISTING=$(gh issue list \
              --label "trivy-monthly-report" \
              --search "${YEAR_MONTH}" \
              --state all \
              --json number --jq 'length' 2>/dev/null || echo "0")
            if [ "$EXISTING" -gt "0" ]; then
              echo "Monthly report for ${MONTH_NAME} already exists – skipped."
              exit 0
            fi
          else
            echo "Manual trigger – duplicate protection skipped."
          fi

          # Issue body from generated monthly report
          {
            if [ -f security/trivy-reports/trivy_monthly_report.md ]; then
              cat security/trivy-reports/trivy_monthly_report.md
            else
              echo "# 🐳 Trivy Monthly Report – ${MONTH_NAME}"
              echo ""
              echo "| Severity | Count |"
              echo "|----------|-------|"
              echo "| CRITICAL | ${CRITICAL} |"
              echo "| HIGH     | ${HIGH} |"
              echo "| MEDIUM   | ${MEDIUM} |"
              echo "| LOW      | ${LOW} |"
              echo "| **Total** | **${TOTAL}** |"
              echo ""
              echo "Dockerfile misconfigurations: **${MISCONFIGS}**"
            fi
            echo ""
            echo "---"
            echo "**Full report:** [trivy_monthly_report.md](https://github.com/${REPO_FULL}/blob/Development/security/trivy-reports/trivy_monthly_report.md)"
            echo "**HIGH/CRITICAL report:** [trivy_high_critical.md](https://github.com/${REPO_FULL}/blob/Development/security/trivy-reports/trivy_high_critical.md)"
            echo "*Automatically generated by GitHub Actions (Trivy Monthly Report Workflow).*"
          } > /tmp/trivy_monthly_body.md

          echo "Issue body created ($(wc -c < /tmp/trivy_monthly_body.md) bytes)"

          ISSUE_URL=$(
            gh issue create \
              --title "${TITLE}" \
              --body-file /tmp/trivy_monthly_body.md \
              --label "trivy-monthly-report" \
              --assignee "Bheowulf" 2>/dev/null \
            || gh issue create \
              --title "${TITLE}" \
              --body-file /tmp/trivy_monthly_body.md \
              --label "trivy-monthly-report" 2>/dev/null \
            || gh issue create \
              --title "${TITLE}" \
              --body-file /tmp/trivy_monthly_body.md
          )
          echo "✅ Issue created: ${ISSUE_URL}"
