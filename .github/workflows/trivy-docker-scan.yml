# ──────────────────────────────────────────────────────────────
# Trivy Sicherheits-Scan – Docker-Image + Repository-Quellcode
# ──────────────────────────────────────────────────────────────
# Scannt mit Trivy auf:
#   1. OS/APT-Paket-Schwachstellen im Docker-Image
#   2. Sprach-Paket-Schwachstellen (pip, npm, etc.) im Image
#   3. Dockerfile-Misconfigurations (Best-Practice-Verstöße)
#   4. Repository-Quellcode (setup.py, package.xml etc.)
#      → erfasst Abhängigkeiten die NICHT im Docker-Image sind
#
# Ergebnisse werden in security/trivy-reports/ abgelegt.
#
# Trigger: Täglich 07:00 UTC | Manuell | Push auf Development
# ──────────────────────────────────────────────────────────────

name: Trivy Docker-Image-Scan

on:
  schedule:
    - cron: "0 7 * * *"          # Täglich 07:00 UTC
  workflow_dispatch:               # Manuell auslösbar
  push:
    branches:
      - Development

permissions:
  contents: write
  issues: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Repository auschecken ──────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Docker-Image bauen ─────────────────────────────────
      - name: Docker-Image bauen
        run: |
          docker build -t schunk-gripper:scan .

      # ── 3. Trivy installieren ─────────────────────────────────
      - name: Trivy installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      # ── 4. Image-Vulnerability-Scan ───────────────────────────
      - name: "Trivy: Image-Vulnerability-Scan"
        id: vuln_scan
        run: |
          mkdir -p security/trivy-reports

          # JSON-Report (maschinenlesbar)
          trivy image \
            --format json \
            --output security/trivy-reports/trivy_image_report.json \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            schunk-gripper:scan || true

          # Tabellen-Report (menschenlesbar)
          trivy image \
            --format table \
            --output security/trivy-reports/trivy_image_report.txt \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            schunk-gripper:scan || true

          echo "--- Trivy Image-Scan Zusammenfassung ---"
          cat security/trivy-reports/trivy_image_report.txt || true

      # ── 5. HIGH/CRITICAL-Only Report ─────────────────────────
      - name: "Trivy: HIGH/CRITICAL Schwachstellen-Report"
        run: |
          # Separater Scan nur für HIGH + CRITICAL (Tabelle)
          trivy image \
            --format table \
            --output security/trivy-reports/trivy_high_critical.txt \
            --severity HIGH,CRITICAL \
            schunk-gripper:scan || true

          # Separater Scan nur für HIGH + CRITICAL (JSON)
          trivy image \
            --format json \
            --output security/trivy-reports/trivy_high_critical.json \
            --severity HIGH,CRITICAL \
            schunk-gripper:scan || true

          # Markdown-Report aus dem JSON generieren
          python3 - <<'PYEOF'
          import json, datetime

          date = datetime.date.today().isoformat()
          try:
              with open("security/trivy-reports/trivy_high_critical.json") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          vulns = []
          for result in data.get("Results", []):
              target = result.get("Target", "")
              pkg_type = result.get("Type", "")
              for v in result.get("Vulnerabilities", []):
                  vulns.append({
                      "target": target,
                      "type": pkg_type,
                      "id": v.get("VulnerabilityID", ""),
                      "pkg": v.get("PkgName", ""),
                      "installed": v.get("InstalledVersion", ""),
                      "fixed": v.get("FixedVersion", ""),
                      "severity": v.get("Severity", ""),
                      "title": v.get("Title", ""),
                      "url": v.get("PrimaryURL", ""),
                  })

          critical = [v for v in vulns if v["severity"] == "CRITICAL"]
          high = [v for v in vulns if v["severity"] == "HIGH"]

          lines = []
          lines.append(f"# Trivy HIGH/CRITICAL Schwachstellen-Report")
          lines.append(f"")
          lines.append(f"**Datum:** {date}")
          lines.append(f"**Image:** schunk-gripper:scan (gebaut aus Dockerfile)")
          lines.append(f"**Base-Image:** ros:humble-ros-core (Ubuntu 22.04 Jammy)")
          lines.append(f"")
          lines.append(f"| Schweregrad | Anzahl |")
          lines.append(f"|-------------|--------|")
          lines.append(f"| CRITICAL    | {len(critical)} |")
          lines.append(f"| HIGH        | {len(high)} |")
          lines.append(f"| **Gesamt**  | **{len(vulns)}** |")
          lines.append(f"")

          if not vulns:
              lines.append("Keine HIGH- oder CRITICAL-Schwachstellen gefunden.")
          else:
              for sev_label, sev_list in [("CRITICAL", critical), ("HIGH", high)]:
                  if not sev_list:
                      continue
                  lines.append(f"## {sev_label} ({len(sev_list)})")
                  lines.append(f"")
                  lines.append(f"| Paket | CVE | Installiert | Fix verfügbar | Beschreibung |")
                  lines.append(f"|-------|-----|-------------|---------------|--------------|")
                  for v in sev_list:
                      fix = v['fixed'] if v['fixed'] else '—'
                      title = v['title'][:80] if v['title'] else '—'
                      lines.append(f"| {v['pkg']} | [{v['id']}]({v['url']}) | {v['installed']} | {fix} | {title} |")
                  lines.append(f"")

          lines.append(f"---")
          lines.append(f"*Automatisch erstellt von GitHub Actions (Trivy Docker-Image-Scan Workflow).*")

          with open("security/trivy-reports/trivy_high_critical.md", "w") as f:
              f.write("\n".join(lines) + "\n")

          print(f"HIGH/CRITICAL Report: {len(critical)} CRITICAL, {len(high)} HIGH, {len(vulns)} gesamt")
          PYEOF

          echo "--- HIGH/CRITICAL Report ---"
          cat security/trivy-reports/trivy_high_critical.md || true

      # ── 6. Dockerfile-Misconfig-Scan ──────────────────────────
      - name: "Trivy: Dockerfile-Config-Scan"
        run: |
          trivy config \
            --format json \
            --output security/trivy-reports/trivy_config_report.json \
            Dockerfile || true

          trivy config \
            --format table \
            --output security/trivy-reports/trivy_config_report.txt \
            Dockerfile || true

          echo "--- Trivy Config-Scan Zusammenfassung ---"
          cat security/trivy-reports/trivy_config_report.txt || true

      # ── 7. Repository-Filesystem-Scan (Nicht-Docker-Abhängigkeiten) ─
      - name: "Trivy: Repository-Quellcode-Scan"
        run: |
          # Scannt setup.py, package.xml, etc. direkt im Repo
          trivy fs \
            --format json \
            --output security/trivy-reports/trivy_repo_scan.json \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --scanners vuln \
            . || true

          trivy fs \
            --format table \
            --output security/trivy-reports/trivy_repo_scan.txt \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --scanners vuln \
            . || true

          echo "--- Trivy Repo-Scan Zusammenfassung ---"
          cat security/trivy-reports/trivy_repo_scan.txt || true

          # Markdown-Report: Repo-Findings die NICHT im Docker-Image sind
          python3 - <<'PYEOF'
          import json, datetime

          date = datetime.date.today().isoformat()

          # Lade Repo-Scan (filesystem)
          try:
              with open("security/trivy-reports/trivy_repo_scan.json") as f:
                  repo_data = json.load(f)
          except Exception:
              repo_data = {}

          # Lade Image-Scan
          try:
              with open("security/trivy-reports/trivy_image_report.json") as f:
                  image_data = json.load(f)
          except Exception:
              image_data = {}

          # Sammle alle CVE-IDs aus dem Image-Scan
          image_cves = set()
          for r in image_data.get("Results", []):
              for v in r.get("Vulnerabilities", []):
                  image_cves.add(v.get("VulnerabilityID", ""))

          # Sammle Repo-Findings
          repo_vulns = []
          for result in repo_data.get("Results", []):
              target = result.get("Target", "")
              pkg_type = result.get("Type", "")
              for v in result.get("Vulnerabilities", []):
                  repo_vulns.append({
                      "target": target,
                      "type": pkg_type,
                      "id": v.get("VulnerabilityID", ""),
                      "pkg": v.get("PkgName", ""),
                      "installed": v.get("InstalledVersion", ""),
                      "fixed": v.get("FixedVersion", ""),
                      "severity": v.get("Severity", ""),
                      "title": v.get("Title", ""),
                      "url": v.get("PrimaryURL", ""),
                      "in_image": v.get("VulnerabilityID", "") in image_cves,
                  })

          # Nur Findings die NICHT im Docker-Image enthalten sind
          repo_only = [v for v in repo_vulns if not v["in_image"]]
          # Alle Findings (auch überlappende)
          all_repo = repo_vulns

          lines = []
          lines.append("# Trivy Repository-Quellcode-Scan")
          lines.append("")
          lines.append(f"**Datum:** {date}")
          lines.append("**Scan-Typ:** Filesystem-Scan (setup.py, package.xml, etc.)")
          lines.append("**Scope:** Alle deklarierten Abhängigkeiten im Repository")
          lines.append("")
          lines.append("## Übersicht")
          lines.append("")

          sev_order = ["CRITICAL", "HIGH", "MEDIUM", "LOW"]
          lines.append("| Schweregrad | Repo gesamt | Nur Repo (nicht im Docker) |")
          lines.append("|-------------|-------------|---------------------------|")
          for sev in sev_order:
              total = len([v for v in all_repo if v["severity"] == sev])
              only = len([v for v in repo_only if v["severity"] == sev])
              lines.append(f"| {sev} | {total} | {only} |")
          lines.append(f"| **Gesamt** | **{len(all_repo)}** | **{len(repo_only)}** |")
          lines.append("")

          if repo_only:
              lines.append("## Schwachstellen NUR im Repository (nicht im Docker-Image)")
              lines.append("")
              lines.append("Diese CVEs betreffen Abhängigkeiten die im Repository deklariert,")
              lines.append("aber **nicht** im Docker-Image installiert sind (z.B. Test-Dependencies).")
              lines.append("")
              lines.append("| Schweregrad | Quelle | Paket | CVE | Version | Fix | Beschreibung |")
              lines.append("|-------------|--------|-------|-----|---------|-----|--------------|")
              for v in sorted(repo_only, key=lambda x: sev_order.index(x["severity"]) if x["severity"] in sev_order else 99):
                  fix = v["fixed"] if v["fixed"] else "—"
                  title = v["title"][:60] if v["title"] else "—"
                  lines.append(f"| {v['severity']} | {v['target']} | {v['pkg']} | [{v['id']}]({v['url']}) | {v['installed']} | {fix} | {title} |")
              lines.append("")
          else:
              lines.append("Keine zusätzlichen Schwachstellen außerhalb des Docker-Images gefunden.")
              lines.append("")

          if all_repo:
              lines.append("## Alle Repository-Findings (vollständig)")
              lines.append("")
              lines.append("| Schweregrad | Quelle | Paket | CVE | Version | Im Docker? | Beschreibung |")
              lines.append("|-------------|--------|-------|-----|---------|------------|--------------|")
              for v in sorted(all_repo, key=lambda x: sev_order.index(x["severity"]) if x["severity"] in sev_order else 99):
                  in_docker = "✅" if v["in_image"] else "❌"
                  title = v["title"][:60] if v["title"] else "—"
                  lines.append(f"| {v['severity']} | {v['target']} | {v['pkg']} | [{v['id']}]({v['url']}) | {v['installed']} | {in_docker} | {title} |")
              lines.append("")

          lines.append("---")
          lines.append("*Automatisch erstellt von GitHub Actions (Trivy Docker-Image-Scan Workflow).*")

          with open("security/trivy-reports/trivy_repo_scan.md", "w") as f:
              f.write("\n".join(lines) + "\n")

          print(f"Repo-Scan: {len(all_repo)} gesamt, {len(repo_only)} nur im Repo (nicht im Docker)")
          PYEOF

          echo "--- Repo-Scan Report ---"
          cat security/trivy-reports/trivy_repo_scan.md || true

      # ── 8. Zusammenfassung erstellen ──────────────────────────────
      - name: Scan-Zusammenfassung erstellen
        id: summary
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          REPORT="security/trivy-reports/trivy_summary.md"

          # Zähle Schwachstellen aus dem JSON-Report
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' security/trivy-reports/trivy_image_report.json 2>/dev/null || echo "0")
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' security/trivy-reports/trivy_image_report.json 2>/dev/null || echo "0")
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' security/trivy-reports/trivy_image_report.json 2>/dev/null || echo "0")
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' security/trivy-reports/trivy_image_report.json 2>/dev/null || echo "0")
          TOTAL=$((CRITICAL + HIGH + MEDIUM + LOW))

          # Zähle Dockerfile-Misconfigs
          MISCONFIGS=$(jq '[.Results[]?.Misconfigurations[]?] | length' security/trivy-reports/trivy_config_report.json 2>/dev/null || echo "0")

          # Zähle Repo-Scan Findings
          REPO_TOTAL=$(jq '[.Results[]?.Vulnerabilities[]?] | length' security/trivy-reports/trivy_repo_scan.json 2>/dev/null || echo "0")
          REPO_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH" or .Severity=="CRITICAL")] | length' security/trivy-reports/trivy_repo_scan.json 2>/dev/null || echo "0")

          cat > "$REPORT" << EOF
          # Trivy Docker-Image-Scan – Zusammenfassung

          **Datum:** ${DATE}
          **Image:** schunk-gripper:scan (gebaut aus Dockerfile)
          **Base-Image:** ros:humble-ros-core (Ubuntu 22.04 Jammy)
          **Scanner:** Trivy (GitHub Actions)

          ## Schwachstellen (Image-Scan)

          | Schweregrad | Anzahl |
          |-------------|--------|
          | CRITICAL    | ${CRITICAL} |
          | HIGH        | ${HIGH} |
          | MEDIUM      | ${MEDIUM} |
          | LOW         | ${LOW} |
          | **Gesamt**  | **${TOTAL}** |

          ## Dockerfile-Misconfigurations

          Gefundene Misconfigurations: **${MISCONFIGS}**

          ## Repository-Quellcode-Scan (Nicht-Docker-Abhängigkeiten)

          Gefundene Schwachstellen im Repo: **${REPO_TOTAL}** (davon HIGH/CRITICAL: **${REPO_HIGH}**)

          Siehe **[trivy_repo_scan.md](trivy_repo_scan.md)** für Details inkl. Abgleich mit Docker-Image.

          ## Reports

          - **[trivy_high_critical.md](trivy_high_critical.md) – HIGH/CRITICAL Schwachstellen (Markdown)**
          - **[trivy_repo_scan.md](trivy_repo_scan.md) – Repository-Quellcode-Scan (Nicht-Docker)**
          - [trivy_high_critical.json](trivy_high_critical.json) – HIGH/CRITICAL Schwachstellen (JSON)
          - [trivy_high_critical.txt](trivy_high_critical.txt) – HIGH/CRITICAL Schwachstellen (Tabelle)
          - [trivy_image_report.json](trivy_image_report.json) – Vollständiger Image-Scan (JSON)
          - [trivy_image_report.txt](trivy_image_report.txt) – Image-Scan (Tabelle)
          - [trivy_repo_scan.json](trivy_repo_scan.json) – Repository-Scan (JSON)
          - [trivy_repo_scan.txt](trivy_repo_scan.txt) – Repository-Scan (Tabelle)
          - [trivy_config_report.json](trivy_config_report.json) – Dockerfile-Config-Scan (JSON)
          - [trivy_config_report.txt](trivy_config_report.txt) – Dockerfile-Config-Scan (Tabelle)

          ---
          *Automatisch erstellt von GitHub Actions (Trivy Docker-Image-Scan Workflow).*
          EOF

          # Heredoc-Einrückung entfernen
          sed -i 's/^          //' "$REPORT"

          echo "critical_count=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high_count=${HIGH}" >> "$GITHUB_OUTPUT"
          echo "total_count=${TOTAL}" >> "$GITHUB_OUTPUT"

          # Flag für Issue-Alert
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "high_severity=true" >> "$GITHUB_OUTPUT"
          else
            echo "high_severity=false" >> "$GITHUB_OUTPUT"
          fi

          echo "--- Zusammenfassung ---"
          echo "CRITICAL: ${CRITICAL} | HIGH: ${HIGH} | MEDIUM: ${MEDIUM} | LOW: ${LOW} | TOTAL: ${TOTAL}"
          echo "Dockerfile-Misconfigs: ${MISCONFIGS}"

      # ── 9. Reports committen ──────────────────────────────
      - name: Reports committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f security/trivy-reports/ || echo "Nichts zum Adden."
          git diff --cached --quiet && echo "Keine Änderungen." && exit 0
          git commit -m "security: Trivy Docker-Image-Scan Report $(date -u +%Y-%m-%d)"
          git push

      # ── 10. Issue-Alert bei kritischen Schwachstellen ─────────
      - name: Issue-Alert bei kritischen Schwachstellen
        if: steps.summary.outputs.high_severity == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          CRITICAL_COUNT: ${{ steps.summary.outputs.critical_count }}
          HIGH_COUNT: ${{ steps.summary.outputs.high_count }}
          TOTAL_COUNT: ${{ steps.summary.outputs.total_count }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          TITLE="🐳 Trivy-Alert: ${CRITICAL_COUNT} CRITICAL + ${HIGH_COUNT} HIGH Schwachstelle(n) im Docker-Image (${DATE})"

          gh label create "trivy-alert" \
            --description "Trivy Docker-Scan: Kritische Schwachstelle (HIGH/CRITICAL)" \
            --color "b60205" 2>/dev/null || true

          # Prüfe ob heute bereits ein Issue existiert
          EXISTING=$(gh issue list \
            --label "trivy-alert" \
            --search "${DATE}" \
            --state open \
            --json number --jq 'length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt "0" ]; then
            echo "Issue für heute existiert bereits – übersprungen."
            exit 0
          fi

          {
            echo "## 🐳 Trivy Docker-Image-Scan – ${DATE}"
            echo ""
            echo "Der automatische Trivy-Scan des Docker-Images hat **kritische Schwachstellen** gefunden:"
            echo ""
            echo "| Schweregrad | Anzahl |"
            echo "|-------------|--------|"
            echo "| CRITICAL    | ${CRITICAL_COUNT} |"
            echo "| HIGH        | ${HIGH_COUNT} |"
            echo "| Gesamt      | ${TOTAL_COUNT} |"
            echo ""
            echo "### Nächste Schritte"
            echo "1. Report prüfen: [trivy_summary.md](https://github.com/${REPO_FULL}/blob/Development/security/trivy-reports/trivy_summary.md)"
            echo "2. Betroffene Pakete identifizieren und aktualisieren"
            echo "3. Docker-Image neu bauen und erneut scannen"
            echo ""
            echo "---"
            echo "*Automatisch erstellt von GitHub Actions (Trivy Docker-Image-Scan Workflow).*"
          } > /tmp/trivy_issue_body.md

          ISSUE_URL=$(
            gh issue create \
              --title "${TITLE}" \
              --body-file /tmp/trivy_issue_body.md \
              --label "trivy-alert" \
              --assignee "Bheowulf" 2>/dev/null \
            || gh issue create \
              --title "${TITLE}" \
              --body-file /tmp/trivy_issue_body.md \
              --label "trivy-alert" 2>/dev/null \
            || gh issue create \
              --title "${TITLE}" \
              --body-file /tmp/trivy_issue_body.md
          )
          echo "✅ Issue erstellt: ${ISSUE_URL}"
