# ---------------------------------------------------------------------------
# Test Device Configuration File
# ---------------------------------------------------------------------------
# Purpose:
#   Defines the configuration for all test devices used in the
#   `schunk_gripper_library` test suite.
#
# Description:
#   Each entry under this file represents a physical or simulated device
#   that can be accessed during testing. Devices may communicate via
#   Ethernet or Modbus Serial.
#
# Device Types:
#   1. Ethernet Device
#      - Required fields:
#          host: <string>  # IP address or hostname (e.g. 192.168.0.10)
#          port: <int>     # port number
#
#   2. Modbus Serial Device
#      - Required fields:
#          serial_port: <string>  # Path to the serial interface (e.g. /dev/ttyUSB0)
#          device_id: <int>       # Modbus slave ID
#
# Optional Fields (for all devices):
#   workpiece_at_position: <int>  # Position in mm at which a workpiece is assumed to be located.
#                                 # The grip direction is determined from this position and the gripper's position.
#                                 # If not specified, then no workpiece is assumed.
#
# Rules & Notes:
#   - Each device must have a unique name.
#   - Do not combine Ethernet and Modbus fields in the same device entry.
#   - This file supports any number of devices.
#   - All unspecified optional fields use their default values.
# ---------------------------------------------------------------------------

# Example device definitions:

# my_ethernet_device:
#   host: 192.168.0.10
#   port: 80
#   workpiece_position: 5

# my_modbus_device:
#   serial_port: /dev/ttyUSB0
#   device_id: 12

